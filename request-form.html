<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Peer Tutoring Hub | Request a Session</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="site-header">
        <nav class="container d-flex flex-wrap align-items-center justify-content-between py-3">
            <a class="site-name" href="index.html">Peer Tutoring Hub</a>
            <div>
                <a class="nav-link-custom" href="index.html">Home</a>
                <a class="nav-link-custom" href="tutors.html">Tutors</a>
                <a class="nav-link-custom" href="request-form.html">Request a Session</a>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <h1>Request a Tutoring Session</h1>
        <p>Fill in the course you need help with and your preferred date.</p>

        <form class="request-form" action="process-request.php" method="post">
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <label class="form-label" for="course">Course</label>
                    <input class="form-control" id="course" name="course" type="text"
                        placeholder="e.g. IS 6465" required>
                </div>
                <div class="col-12 col-md-6">
                    <label class="form-label" for="date">Preferred Date</label>
                    <input class="form-control" id="date" name="date" type="date" required>
                </div>
                <div class="col-12">
                    <button class="btn btn-primary" type="submit">Request Session</button>
                </div>
            </div>
        </form>
    </main>
</body>

</html>
